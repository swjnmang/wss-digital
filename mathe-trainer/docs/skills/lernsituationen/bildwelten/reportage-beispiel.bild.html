<!doctype html>

<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Gochi+Hand&display=swap" rel="stylesheet"><style>body{margin:0}</style></head><body>

<svg id="bild" xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">

  </linearGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d5a3a"/><stop offset="1" stop-color="#14231a"/></linearGradient>
  <linearGradient id="busBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f2ee"/><stop offset=".6" stop-color="#c9c7c2"/><stop offset="1" stop-color="#7d7a76"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6c27a"/><stop offset=".5" stop-color="#5a3c55"/><stop offset="1" stop-color="#1a1f33"/></linearGradient>

  <filter id="blurBg"><feGaussianBlur stdDeviation="2.4"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .22 0"/></filter>
