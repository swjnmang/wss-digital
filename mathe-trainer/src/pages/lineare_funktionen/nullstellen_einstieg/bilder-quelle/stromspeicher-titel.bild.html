<!doctype html>
<!-- Der Stromspeicher, Titelbild. Bildwelt Bauplan / CAD dunkel: Schnitt durch das Haus mit Solaranlage und Stromspeicher im Keller.
     Rendern: node scripts/bilder-rendern.cjs src/pages/lineare_funktionen/nullstellen_einstieg -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet"><style>body{margin:0}</style>
<script src="_cad.js"></script></head><body>
<div id="bild" style="width:1200px;height:600px"></div>
<script>
const C = CAD('#8f86ff'), L = C.L, A = C.A;
let g = '';
// Erdreich und Keller
g += `<line x1="40" x2="1160" y1="400" y2="400" stroke="${L}" stroke-width="2.5"/><rect x="40" y="400" width="1120" height="160" fill="url(#schraffur)"/>`;
g += `<rect x="150" y="400" width="440" height="130" fill="#1d2128" stroke="${L}" stroke-width="2.5"/>`;
// Haus im Schnitt
g += `<rect x="150" y="210" width="440" height="190" fill="none" stroke="${L}" stroke-width="3"/>`;
g += `<polygon points="130,212 370,70 610,212" fill="none" stroke="${L}" stroke-width="3"/>`;
g += `<line x1="150" x2="590" y1="306" y2="306" stroke="${L}" stroke-width="1.5" stroke-dasharray="10 6"/>`;
// Solarmodule auf dem Dach
for (let i = 0; i < 4; i++) { const x = 400 + i * 44, y = 88 + i * 26; g += `<polygon points="${x},${y} ${x + 38},${y + 22} ${x + 30},${y + 36} ${x - 8},${y + 14}" fill="${A}" fill-opacity=".35" stroke="${A}" stroke-width="2"/>`; }
// Fenster mit Licht (Nacht)
g += `<rect x="190" y="240" width="70" height="46" fill="#ffd36a" fill-opacity=".85" stroke="${L}" stroke-width="2"/><rect x="190" y="326" width="70" height="46" fill="#ffd36a" fill-opacity=".85" stroke="${L}" stroke-width="2"/><rect x="470" y="326" width="70" height="46" fill="none" stroke="${L}" stroke-width="2"/>`;
// Stromspeicher im Keller
g += `<rect x="380" y="420" width="110" height="96" rx="6" fill="#262b34" stroke="${A}" stroke-width="3"/><rect x="420" y="410" width="30" height="12" fill="${A}"/>`;
g += `<rect x="392" y="470" width="86" height="34" fill="${A}"/><rect x="392" y="432" width="86" height="72" fill="none" stroke="${A}" stroke-opacity=".6" stroke-dasharray="5 4"/>`;
// Leitung vom Dach zum Speicher
g += `<path d="M560 230 V300 M560 312 V420 H492" fill="none" stroke="${A}" stroke-width="2.5" stroke-dasharray="12 6"/>`;
// Hinweislinien
g += `<line x1="490" y1="468" x2="660" y2="468" stroke="${L}" stroke-width="1.4"/><circle cx="490" cy="468" r="4" fill="${L}"/>`;
g += `<g font-family="Barlow Condensed" fill="${L}"><circle cx="684" cy="468" r="20" fill="none" stroke="${L}" stroke-width="2"/><text x="684" y="476" font-size="22" font-weight="700" text-anchor="middle">1</text>
<text x="714" y="462" font-size="27" font-weight="600" fill="#fff">Stromspeicher</text><text x="714" y="490" font-size="22" font-weight="500">um 20:00 Uhr: 2,5 kWh</text></g>`;
g += `<line x1="230" y1="263" x2="84" y2="92" stroke="${L}" stroke-width="1.4"/><circle cx="230" cy="263" r="4" fill="${L}"/>`;
g += `<g font-family="Barlow Condensed" fill="${L}"><circle cx="70" cy="74" r="20" fill="#21262e" stroke="${L}" stroke-width="2"/><text x="70" y="82" font-size="22" font-weight="700" text-anchor="middle">2</text>
<text x="102" y="68" font-size="27" font-weight="600" fill="#fff">Verbrauch</text><text x="102" y="96" font-size="22" font-weight="500">0,4 kWh pro Stunde</text></g>`;
g += C.feld(800, 60, 340, 'Stromspeicher Demir', [['Ladestand', 'y = −0,4x + 2,5'], ['x', 'Stunden ab 20 Uhr'], ['leer um', '? : ?? Uhr']], A);
document.getElementById('bild').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">${C.defs}${C.grund(1200, 600)}${g}</svg>`;
</script>
</body></html>
