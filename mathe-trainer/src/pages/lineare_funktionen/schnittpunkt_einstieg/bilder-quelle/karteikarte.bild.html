<!doctype html>
<!-- Die Lasershow, Handlungsprodukt Spickzettel. Bildwelt Diorama / nacht: Karteikarte auf dem Pult, isometrisch, weiches Licht.
     Rendern: node scripts/bilder-rendern.cjs src/pages/lineare_funktionen/schnittpunkt_einstieg -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Caveat:wght@600&display=swap" rel="stylesheet"><style>body{margin:0}</style></head><body>
<svg id="bild" xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
 <defs>
  <radialGradient id="bg" cx=".5" cy=".3" r=".9"><stop offset="0" stop-color="#2c3770"/><stop offset="1" stop-color="#121839"/></radialGradient>
  <radialGradient id="licht" cx=".5" cy=".45" r=".5"><stop offset="0" stop-color="#fff3c9" stop-opacity=".35"/><stop offset="1" stop-color="#fff3c9" stop-opacity="0"/></radialGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
 </defs>
 <rect width="800" height="400" fill="url(#bg)"/>
 <ellipse cx="400" cy="210" rx="360" ry="200" fill="url(#licht)"/>
 <!-- Karteikarte, leicht gedreht -->
 <g transform="translate(400 200) rotate(-4) translate(-250 -140)" filter="url(#sh)">
  <rect width="500" height="280" rx="14" fill="#fbfbff"/>
  <rect width="500" height="58" rx="14" fill="#ecebf9"/>
  <rect y="44" width="500" height="14" fill="#ecebf9"/>
  <line x1="0" x2="500" y1="58" y2="58" stroke="#4338a6" stroke-width="3"/>
  <text x="26" y="40" font-family="Fredoka" font-weight="600" font-size="28" fill="#22263f">Schnittpunkt berechnen</text>
  <g font-family="Fredoka" font-weight="600" font-size="22" fill="#4338a6">
   <text x="26" y="100">1.</text><text x="26" y="146">2.</text><text x="26" y="192">3.</text><text x="26" y="238">4.</text>
  </g>
  <g font-family="Caveat" font-weight="600" font-size="27" fill="#3a3f63">
   <text x="58" y="101">Terme gleichsetzen</text>
   <text x="58" y="147">x auf eine Seite …</text>
   <text x="58" y="193">x einsetzen, Probe</text>
   <text x="58" y="239">S( … | … ) angeben</text>
  </g>
  <line x1="330" y1="236" x2="470" y2="96" stroke="#4338a6" stroke-width="5" stroke-linecap="round"/>
  <line x1="330" y1="110" x2="470" y2="226" stroke="#e25aa8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="401" cy="168" r="10" fill="#ffd34d" stroke="#22263f" stroke-width="2.5"/>
 </g>
 <!-- Stift -->
 <g transform="translate(640 300) rotate(-38)">
  <rect x="-80" y="-9" width="150" height="18" rx="4" fill="#6a5fe0"/>
  <polygon points="70,-9 92,0 70,9" fill="#f2d3a0"/><polygon points="86,-2.5 92,0 86,2.5" fill="#22263f"/>
 </g>
</svg>
</body></html>
