<!doctype html>
<!-- Die Scooter-App, Fahrtenverlauf. Bildwelt Comic / pop: Handy mit zwei Fahrten, Tarif wird nicht angezeigt.
     Rendern: node scripts/bilder-rendern.cjs src/pages/lineare_funktionen/funktionsgleichung_einstieg -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet"><style>body{margin:0}</style>
<script src="_comic.js"></script></head><body>
<div id="bild" style="width:1200px;height:600px"></div>
<script>
const C = CO('#0e6670', '#d9eef0');
const ink = '#141414';
let s = '';
const zeile = (y, a, b, c) => `<rect x="420" y="${y}" width="360" height="92" rx="12" fill="#d9eef0" stroke="${ink}" stroke-width="4"/>
 <text x="444" y="${y + 38}" font-family="Comic Neue" font-weight="700" font-size="30" fill="${ink}">${a}</text>
 <text x="444" y="${y + 74}" font-family="Comic Neue" font-weight="700" font-size="26" fill="#3b4a4c">${b}</text>
 <text x="760" y="${y + 42}" font-family="Bangers" font-size="42" text-anchor="end" fill="${ink}" letter-spacing="1">${c}</text>`;
let inhalt = `<g stroke="#fff" stroke-width="6" opacity=".9">${[0,1,2,3,4,5,6,7].map(i=>`<line x1="600" y1="300" x2="${600+700*Math.cos(i*Math.PI/4+.3)}" y2="${300+700*Math.sin(i*Math.PI/4+.3)}"/>`).join('')}</g>`;
inhalt += `<rect x="390" y="30" width="420" height="560" rx="44" fill="#fff" stroke="${ink}" stroke-width="7"/>`;
inhalt += `<rect x="420" y="66" width="360" height="70" rx="12" fill="#0e6670" stroke="${ink}" stroke-width="4"/><text x="600" y="114" font-family="Bangers" font-size="42" text-anchor="middle" fill="#fff" letter-spacing="2">MEINE FAHRTEN</text>`;
inhalt += zeile(160, 'Fahrt 1', 'Montag, 8 Minuten', '2,60 €') + zeile(272, 'Fahrt 2', 'Mittwoch, 20 Minuten', '5,00 €');
inhalt += `<line x1="420" x2="780" y1="392" y2="392" stroke="${ink}" stroke-width="3" stroke-dasharray="8 8"/>`;
inhalt += `<text x="444" y="440" font-family="Comic Neue" font-weight="700" font-size="30" fill="${ink}">Guthaben</text><text x="760" y="440" font-family="Bangers" font-size="44" text-anchor="end" fill="${ink}">7,20 €</text>`;
inhalt += `<rect x="420" y="470" width="360" height="62" rx="12" fill="#fff6c9" stroke="${ink}" stroke-width="4"/><text x="600" y="512" font-family="Comic Neue" font-weight="700" font-size="28" text-anchor="middle" fill="${ink}">Tarif: wird nicht angezeigt</text>`;
inhalt += C.blase(40, 70, 300, 120, 388, 240, ['Wie viel kostet', 'die Minute?'], 32);
inhalt += C.blase(860, 330, 300, 120, 812, 300, ['Und was kostet', 'das Entsperren?'], 32);
s += C.panel('p', '24,24 1176,24 1176,576 24,576', 'url(#pT)', inhalt);
document.getElementById('bild').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">${C.defs}${C.papier(1200, 600)}${s}${C.korn(1200, 600)}</svg>`;
</script>
</body></html>
