<!doctype html>
<!-- Die Scooter-App, Handlungsprodukt Anleitung „Tarif knacken“. Bildwelt Comic / pop: Spickzettel als Panel.
     Rendern: node scripts/bilder-rendern.cjs src/pages/lineare_funktionen/funktionsgleichung_einstieg -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Lilita+One&family=Comic+Neue:wght@700&display=swap" rel="stylesheet"><style>body{margin:0}</style>
<script src="_comic.js"></script></head><body>
<div id="bild" style="width:800px;height:400px"></div>
<script>
const C = CO('#0e6670', '#d9eef0');
const ink = '#141414';
let inhalt = `<g transform="rotate(-2 400 210)"><rect x="110" y="70" width="580" height="290" fill="#fff" stroke="${ink}" stroke-width="6"/>
<rect x="110" y="70" width="580" height="64" fill="#0e6670" stroke="${ink}" stroke-width="6"/>
<text x="140" y="116" font-family="Lilita One" font-size="42" fill="#fff" letter-spacing="2">TARIF KNACKEN</text>`;
['Zwei Fahrten als Punkte', 'Steigung m berechnen', 't berechnen, Probe machen'].forEach((t, i) => {
  const y = 186 + i * 56;
  inhalt += `<circle cx="160" cy="${y - 10}" r="20" fill="#f5c400" stroke="${ink}" stroke-width="4"/><text x="160" y="${y}" font-family="Lilita One" font-size="28" text-anchor="middle" fill="${ink}">${i + 1}</text><text x="196" y="${y}" font-family="Comic Neue" font-weight="700" font-size="28" fill="${ink}">${t}</text>`;
});
inhalt += `<line x1="530" y1="330" x2="670" y2="170" stroke="#0e6670" stroke-width="7" stroke-linecap="round"/><circle cx="565" cy="290" r="11" fill="#f5c400" stroke="${ink}" stroke-width="4"/><circle cx="640" cy="205" r="11" fill="#f5c400" stroke="${ink}" stroke-width="4"/></g>`;
inhalt += C.laut(540, 64, 'GEKNACKT!', 44, 5);
const s = C.panel('p', '18,18 782,18 782,382 18,382', 'url(#pF)', inhalt);
document.getElementById('bild').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">${C.defs}${C.papier(800, 400)}${s}${C.korn(800, 400)}</svg>`;
</script>
</body></html>
