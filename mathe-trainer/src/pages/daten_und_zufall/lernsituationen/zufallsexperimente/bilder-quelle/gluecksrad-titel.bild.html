<!doctype html>
<!-- Das Glücksrad, Titelbild. Bildwelt Diorama / Holzspielzeug: der Stand der SMV als Holzspielzeug mit Glücksrad (12 Felder: 1 Hauptgewinn, 3 Trostpreise, 8 Nieten) und Werbeschild.
     Rendern: node scripts/bilder-rendern.cjs src/pages/daten_und_zufall/lernsituationen/zufallsexperimente -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet"><style>body{margin:0}</style><script src="_holz.js"></script></head><body>
<div id="bild" style="width:1200px;height:600px"></div>
<script>
const { P, poly, box, defs } = HZ(540, 250, 0.85);
const FELDER = ['H', 'N', 'N', 'T', 'N', 'N', 'N', 'T', 'N', 'N', 'T', 'N'];
const farbe = { H: '#f2c14e', T: '#4338a6', N: '#f6ead3' }, zeichen = { H: '★', T: '●', N: '' };
let g = '';
g += `<ellipse cx="600" cy="540" rx="430" ry="40" fill="#6b4a2a" opacity=".25" filter="url(#sh)"/>`;
// Bodenplatte
g += box(-60, -60, -30, 480, 360, 30, '#e8c99a', '#c79a64', '#b0844f');
// Tresen
g += box(80, 200, 0, 300, 70, 90, '#d9b27c', '#4338a6', '#362d8a');
// Pfosten der Markise
g += box(80, 200, 90, 14, 14, 120, '#d9b27c', '#c79a64', '#b0844f') + box(366, 200, 90, 14, 14, 120, '#d9b27c', '#c79a64', '#b0844f');
// Markise mit Streifen
for (let i = 0; i < 6; i++) g += box(80 + i * 50, 170, 210, 50, 110, 14, i % 2 ? '#f6ead3' : '#4338a6', i % 2 ? '#e8dcc2' : '#362d8a', i % 2 ? '#ddd0b5' : '#2c2470', false);
// Bauklötze mit SMV
['S', 'M', 'V'].forEach((b, i) => { g += box(-30 + i * 46, 230, 0, 40, 40, 40, ['#e76f51', '#f2c14e', '#2a9d8f'][i], ['#c95a3f', '#d9a83a', '#22867a'][i], ['#b44f37', '#c99a33', '#1d746a'][i]); const [x, y] = P(-10 + i * 46, 270, 22); g += `<text x="${x - 8}" y="${y + 6}" font-family="Fredoka" font-weight="700" font-size="28" fill="#fff" transform="skewY(30)" transform-origin="${x} ${y}">${b}</text>`; });
// Glücksrad hinter dem Tresen
const [rx, ry] = P(230, 120, 240);
g += box(222, 150, 0, 16, 16, 170, '#d9b27c', '#c79a64', '#b0844f');
g += RAD(rx + 10, ry, 125, FELDER.map((f) => farbe[f]), FELDER.map((f) => zeichen[f]));
g += `<polygon points="${rx + 10},${ry - 112} ${rx - 6},${ry - 146} ${rx + 26},${ry - 146}" fill="#e76f51" stroke="#5a3d22" stroke-width="3"/>`;
// Werbeschild
g += `<g transform="rotate(4 980 170)"><rect x="860" y="100" width="260" height="140" rx="14" fill="#f6ead3" stroke="#5a3d22" stroke-width="5" filter="url(#maser)"/>`
  + `<text x="990" y="160" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="34" fill="#4338a6">Bei uns gewinnt</text>`
  + `<text x="990" y="208" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="40" fill="#e76f51">jeder Vierte!</text></g>`
  + `<line x1="990" y1="240" x2="990" y2="420" stroke="#8a6238" stroke-width="12"/>`;
document.getElementById('bild').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">${defs(1200, 600)}${g}</svg>`;
</script>
</body></html>
