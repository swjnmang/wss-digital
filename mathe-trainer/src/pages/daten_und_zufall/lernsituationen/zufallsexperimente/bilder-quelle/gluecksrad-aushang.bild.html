<!doctype html>
<!-- Das Glücksrad, Handlungsprodukt: Aushang „Unser faires Glücksrad“ als Holztafel mit kleinem Rad und Zeilen für die Wahrscheinlichkeiten. Bildwelt Diorama / Holzspielzeug.
     Rendern: node scripts/bilder-rendern.cjs src/pages/daten_und_zufall/lernsituationen/zufallsexperimente -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet"><style>body{margin:0}</style><script src="_holz.js"></script></head><body>
<div id="bild" style="width:800px;height:400px"></div>
<script>
const { defs } = HZ(0, 0);
const FELDER = ['H', 'N', 'N', 'T', 'N', 'N', 'N', 'T', 'N', 'N', 'T', 'N'];
const farbe = { H: '#f2c14e', T: '#4338a6', N: '#f6ead3' };
let g = `<rect x="60" y="40" width="680" height="320" rx="22" fill="#c79a64" filter="url(#maser)"/><rect x="80" y="60" width="640" height="280" rx="14" fill="#f6ead3"/>`;
g += `<text x="400" y="112" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="40" fill="#4338a6">Unser faires Glücksrad</text>`;
g += RAD(210, 230, 90, FELDER.map((f) => farbe[f]), [], 10);
g += ['P(Hauptgewinn) = …', 'P(Gewinn) = …', 'P(Niete) = …', 'Jeder … gewinnt!'].map((t, i) => `<text x="340" y="${180 + i * 44}" font-family="Fredoka" font-weight="600" font-size="28" fill="${i === 3 ? '#e76f51' : '#2b2140'}">${t}</text>`).join('');
document.getElementById('bild').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">${defs(800, 400)}${g}</svg>`;
</script>
</body></html>
