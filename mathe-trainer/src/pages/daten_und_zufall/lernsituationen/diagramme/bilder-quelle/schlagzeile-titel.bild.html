<!doctype html>
<!-- Die Schlagzeile, Titelbild. Bildwelt Reportage / Zeitung (Schwarzweiß): Titelseite des „Stadtboten“ mit der Schlagzeile, einem Säulendiagramm mit abgeschnittener Achse und einer Lupe.
     Rendern: node scripts/bilder-rendern.cjs src/pages/daten_und_zufall/lernsituationen/diagramme -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Source+Serif+4:wght@400;700&display=swap" rel="stylesheet"><style>body{margin:0}</style><script src="_zeitung.js"></script></head><body>
<div id="bild" style="width:1200px;height:600px"></div>
<script>
const ink = '#1a1a1a';
let g = `<rect width="1200" height="600" fill="#cfcac0"/>`;
g += `<g transform="rotate(-3 560 300)" filter="url(#schatten)"><rect x="140" y="20" width="820" height="620" fill="#f4f1ea"/>`;
g += `<text x="550" y="96" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="66" fill="${ink}">Der Stadtbote</text>`;
g += `<line x1="170" y1="114" x2="930" y2="114" stroke="${ink}" stroke-width="3"/><line x1="170" y1="120" x2="930" y2="120" stroke="${ink}" stroke-width="1"/>`;
g += `<text x="170" y="196" font-family="Fraunces" font-weight="900" font-size="60" fill="${ink}">Stromkosten explodieren!</text>`;
// Säulendiagramm mit abgeschnittener Achse (98 bis 108)
const sx = 190, sy = 520, H = 250;
const y = (v) => sy - ((v - 98) / 10) * H;
g += `<line x1="${sx}" y1="${sy}" x2="${sx}" y2="${sy - H - 20}" stroke="${ink}" stroke-width="4"/><line x1="${sx}" y1="${sy}" x2="${sx + 400}" y2="${sy}" stroke="${ink}" stroke-width="4"/>`;
g += `<path d="M${sx - 14} ${sy - 18} l14 -8 l-14 -8 l14 -8" fill="none" stroke="${ink}" stroke-width="3"/>`;
[100, 102, 105, 108].forEach((v, i) => { g += `<rect x="${sx + 30 + i * 92}" y="${y(v)}" width="62" height="${sy - y(v)}" fill="url(#raster)" stroke="${ink}" stroke-width="3"/><text x="${sx + 61 + i * 92}" y="${sy + 34}" text-anchor="middle" font-family="Source Serif 4" font-weight="700" font-size="24" fill="${ink}">${2021 + i}</text>`; });
g += ZT.zeilen(640, 240, 280, 14, 22);
g += `</g>`;
// Lupe über dem Achsenknick
g += `<g transform="translate(250 470) rotate(-30)"><rect x="-14" y="80" width="28" height="140" rx="10" fill="${ink}"/><circle cx="0" cy="0" r="90" fill="#ffffff" fill-opacity=".25" stroke="${ink}" stroke-width="16"/></g>`;
document.getElementById('bild').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">${ZT.defs}${g}${ZT.korn(1200, 600)}</svg>`;
</script>
</body></html>
