<!doctype html>
<!-- Der Pausenkiosk, Handlungsprodukt: Plakat „Kiosk-Umfrage“ mit Strichliste, Häufigkeitstabelle und Empfehlung. Bildwelt Comic / pop.
     Rendern: node scripts/bilder-rendern.cjs src/pages/daten_und_zufall/lernsituationen/daten-ordnen -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet"><style>body{margin:0}</style>
<script src="_comic.js"></script></head><body>
<div id="bild" style="width:800px;height:400px"></div>
<script>
const C = CO('#8a5800', '#fbf0da');
const ink = '#141414';
let inhalt = `<g transform="rotate(-2 400 210)"><rect x="140" y="50" width="520" height="320" fill="#fff" stroke="${ink}" stroke-width="6"/>` +
  `<text x="400" y="104" font-family="Bangers" font-size="46" text-anchor="middle" fill="#8a5800" letter-spacing="2">KIOSK-UMFRAGE</text>` +
  ['Wasser', 'Apfelschorle', 'Eistee', 'Kakao'].map((t, i) => `<rect x="170" y="${130 + i * 46}" width="160" height="46" fill="#fbf0da" stroke="${ink}" stroke-width="3"/><text x="180" y="${162 + i * 46}" font-family="Comic Neue" font-weight="700" font-size="24" fill="${ink}">${t}</text><rect x="330" y="${130 + i * 46}" width="120" height="46" fill="#fff" stroke="${ink}" stroke-width="3"/><text x="390" y="${164 + i * 46}" font-family="Comic Neue" font-weight="700" font-size="28" text-anchor="middle" fill="#999">…</text>`).join('') +
  `<rect x="476" y="130" width="160" height="184" fill="#fff6c9" stroke="${ink}" stroke-width="4"/><text x="556" y="176" font-family="Bangers" font-size="28" text-anchor="middle" fill="${ink}">EMPFEHLUNG</text><text x="556" y="230" font-family="Comic Neue" font-weight="700" font-size="40" text-anchor="middle" fill="#999">…</text></g>`;
const s = C.panel('p1', '20,20 780,20 780,380 20,380', 'url(#pT)', inhalt + C.laut(40, 360, 'TADA!', 54, -8));
document.getElementById('bild').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">${C.defs}${C.papier(800, 400)}${s}${C.korn(800, 400)}</svg>`;
</script>
</body></html>
