<!doctype html>
<!-- Das Durchschnittsgehalt: die Stellenanzeige, ausgeschnitten und ins karierte Skizzenbuch geklebt, mit Bleistift-Notizen. Bildwelt Skizzenbuch / kariert.
     Rendern: node scripts/bilder-rendern.cjs src/pages/daten_und_zufall/lernsituationen/kennwerte-bewerten -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet"><style>body{margin:0}</style><script src="_skizze.js"></script></head><body>
<div id="bild" style="width:1200px;height:600px"></div>
<script>
let g = SK.papier(1200, 600);
g += `<g transform="rotate(-2 480 300)"><rect x="160" y="70" width="640" height="440" fill="#fffefb" stroke="#d8d2c4" stroke-width="2"/>` +
  `<rect x="160" y="70" width="640" height="80" fill="#9a4515"/><text x="480" y="124" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="40" fill="#fff">Medienwerkstatt Pixelhof</text>` +
  `<text x="480" y="210" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="44" fill="#2c2a27">Wir suchen Verstärkung!</text>` +
  `<text x="480" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#2c2a27">Ein starkes Team mit 8 Beschäftigten</text>` +
  `<rect x="230" y="320" width="500" height="110" fill="#fbece3" stroke="#9a4515" stroke-width="3"/>` +
  `<text x="480" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#2c2a27">Durchschnittsgehalt</text>` +
  `<text x="480" y="412" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="46" fill="#9a4515">4.200 €</text></g>`;
g += SK.tape(110, 50, -20) + SK.tape(720, 470, -12);
g += SK.stift('<ellipse cx="480" cy="385" rx="290" ry="80"/><path d="M790 330 Q870 260 930 240"/><path d="M915 232 l18 6 l-12 14"/>', 3);
g += SK.hand(950, 220, 'Echt?', 50, '#9a4515') + SK.hand(900, 300, 'Durchschnitt', 34) + SK.hand(900, 340, 'von wem?', 34);
document.getElementById('bild').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">${SK.defs}${g}</svg>`;
</script>
</body></html>
