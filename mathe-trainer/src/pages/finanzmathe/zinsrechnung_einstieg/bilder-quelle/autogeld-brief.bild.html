<!doctype html>
<!-- Lenas Autogeld, Handlungsprodukt Antwort an Lena. Bildwelt Skizzenbuch / Packpapier: Brief mit Umschlag, Fineliner.
     Rendern: node scripts/bilder-rendern.cjs src/pages/finanzmathe/zinsrechnung_einstieg -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet"><style>body{margin:0}</style>
<script src="_packpapier.js"></script></head><body>
<div id="bild" style="width:800px;height:400px"></div>
<script>
const P = PP('#0e6670'), T = P.T;
let g = P.fleck(200, 250, 150, 90);
g += `<g filter="url(#liner)" fill="none" stroke="${T}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
 <rect x="60" y="150" width="280" height="180" rx="6" fill="#fff" fill-opacity=".55"/><polyline points="60,154 200,250 340,154"/><rect x="286" y="166" width="38" height="46" fill="#0e6670" fill-opacity=".5"/>
 <rect x="390" y="40" width="360" height="320" rx="4" fill="#fffdf6"/>
 ${[150, 190, 230, 270, 310].map((y) => `<line x1="420" y1="${y}" x2="${y % 80 ? 720 : 660}" y2="${y}" stroke-width="2" stroke-opacity=".5"/>`).join('')}
</g>
<g font-family="Caveat" font-weight="700" fill="${T}"><text x="90" y="310" font-size="38">An: Lena</text><text x="420" y="100" font-size="44">Liebe Lena,</text><text x="420" y="140" font-size="34" fill="#0e4a52">ich empfehle dir …</text></g>`;
document.getElementById('bild').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">${P.defs}${P.grund(800, 400)}${g}</svg>`;
</script>
</body></html>
