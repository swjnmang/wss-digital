<!doctype html>
<!-- Die Abschlussfahrt-Kasse, Pinnwand mit drei Fragen (K, p, t). Bildwelt Siebdruck / schwarz.
     Rendern: node scripts/bilder-rendern.cjs src/pages/finanzmathe/zinsrechnung_einstieg -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&display=swap" rel="stylesheet">
<style>body{margin:0} text{font-family:'Bricolage Grotesque';font-variation-settings:'wdth' 75,'opsz' 96}</style>
<script src="_siebdruck.js"></script></head><body><div id="bild"></div>
<script>
const N = [
  { x: 70, d: -3, wer: 'Emma', g: 'K = ?', f: 'Wie viel Geld?' },
  { x: 440, d: 2, wer: 'Noah', g: 'p = ?', f: 'Welcher Zinssatz?' },
  { x: 810, d: -2, wer: 'Frau Yilmaz', g: 't = ?', f: 'Wie viele Tage?' },
];
const beere = N.map(n => `<g transform="rotate(${n.d} ${n.x + 160} 330)"><rect x="${n.x}" y="130" width="320" height="400" fill="RASTER" stroke="none" opacity=".18"/><rect x="${n.x}" y="130" width="320" height="34" stroke="none"/>
 <text x="${n.x + 160}" y="380" text-anchor="middle" font-size="112" font-weight="800" font-style="italic" stroke="none">${n.g}</text></g>`).join('')
 + `<text x="600" y="78" text-anchor="middle" font-size="64" font-weight="800" stroke="none">PINNWAND 10b</text>`;
const schwarz = N.map(n => `<g transform="rotate(${n.d} ${n.x + 160} 330)"><rect x="${n.x}" y="130" width="320" height="400" fill="none" stroke-width="6"/>
 <circle cx="${n.x + 160}" cy="146" r="16" stroke="none"/>
 <text x="${n.x + 160}" y="236" text-anchor="middle" font-size="44" font-weight="800" stroke="none">${n.wer}</text>
 <text x="${n.x + 160}" y="476" text-anchor="middle" font-size="34" font-weight="700" stroke="none">${n.f}</text></g>`).join('')
 + `<rect x="20" y="20" width="1160" height="560" fill="none" stroke-width="8"/>`;
SD.bild(1200, 600, [
  { farbe: '#a0275e', svg: beere },
  { farbe: '#1d1d1f', versatz: [3, -2], svg: schwarz },
]);
</script>
</body></html>
