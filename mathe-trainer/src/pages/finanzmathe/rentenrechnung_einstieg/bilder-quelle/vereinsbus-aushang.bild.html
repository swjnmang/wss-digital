<!doctype html>
<!-- Der Vereinsbus, Handlungsprodukt: Aushang an der verschneiten Pinnwand vor dem Vereinsheim (Diorama / Winter, Frontansicht).
     Rendern: node scripts/bilder-rendern.cjs src/pages/finanzmathe/rentenrechnung_einstieg -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet"><style>body{margin:0}</style><script src="_winter.js"></script></head><body>
<div id="bild" style="width:800px;height:400px"></div>
<script>
const { flocken, hinter } = DI(0, 0);
const baum = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-6" y="-10" width="12" height="26" fill="#7a5a35"/><polygon points="-40,-6 40,-6 0,-76" fill="#3f7a5a"/><polygon points="-30,-40 30,-40 0,-104" fill="#4f8f68"/><polygon points="-12,-80 12,-80 0,-104" fill="#fff"/><path d="M-34 -40 Q0 -50 34 -40" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/></g>`;
const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">' + hinter(800, 400) +
  '<ellipse cx="400" cy="372" rx="380" ry="40" fill="#f7fafc"/><ellipse cx="400" cy="380" rx="300" ry="14" fill="#5b6b7a" opacity=".18" filter="url(#sh)"/>' +
  // Pfosten und Brett
  '<rect x="214" y="250" width="18" height="120" fill="#8d653f"/><rect x="568" y="250" width="18" height="120" fill="#8d653f"/>' +
  '<rect x="190" y="50" width="420" height="230" rx="6" fill="#a87c50"/><rect x="190" y="262" width="420" height="18" fill="#8d653f"/>' +
  '<path d="M184 52 Q200 26 260 34 Q330 22 400 32 Q480 20 540 32 Q600 24 616 52 Z" fill="#fff"/>' +
  // Aushang
  '<rect x="236" y="70" width="328" height="182" fill="#fffdf7" transform="rotate(-1.5 400 160)"/>' +
  '<g transform="rotate(-1.5 400 160)" font-family="Caveat, cursive" fill="#1f2d3d"><rect x="236" y="70" width="328" height="14" fill="#4a6d8c"/>' +
  '<text x="400" y="122" text-anchor="middle" font-size="36" font-weight="700">Reicht es für den Bus?</text>' +
  '<line x1="262" y1="160" x2="538" y2="160" stroke="#1f2d3d" stroke-width="2"/>' + [0,1,2,3,4,5].map(i => `<ellipse cx="${276 + i * 50}" cy="150" rx="13" ry="5" fill="#f2c94c" stroke="#c99a2e" stroke-width="1.5"/>`).join('') +
  '<text x="262" y="200" font-size="28">Unsere Rechnung: …</text><text x="262" y="236" font-size="28">Unsere Empfehlung: …</text></g>' +
  '<circle cx="400" cy="74" r="7" fill="#d64545"/>' +
  baum(100, 340, 1) + baum(700, 330, 1.15) + baum(640, 360, .7) +
  flocken(800, 400, 45, 7) + '</svg>';
document.getElementById('bild').innerHTML = svg;
</script>
</body></html>
