<!doctype html>

<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet"><style>body{margin:0}</style></head><body>
<svg id="bild" xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
 <defs>

 </defs>
 <rect width="800" height="400" fill="url(#tisch)"/>

  <g stroke="#1d2a4a" stroke-width="2" fill="none">
   <rect x="100" y="104" width="300" height="216"/>
   <path d="M100 140 H400 M100 176 H400 M100 212 H400 M100 248 H400 M100 284 H400 M140 104 V320 M220 104 V320 M310 104 V320"/>

  <rect x="100" y="104" width="300" height="36" fill="#9a4b2e" opacity=".25"/>

  <g fill="#9a4b2e" opacity=".85">
   <rect x="470" y="128" width="30" height="192"/><rect x="516" y="136" width="30" height="184"/><rect x="562" y="144" width="30" height="176"/><rect x="608" y="152" width="30" height="168"/><rect x="654" y="160" width="30" height="160"/>

  <text x="560" y="352" font-family="Caveat, cursive" font-size="26" fill="#1d2a4a">Budget: 14.500 €</text>
 </g>
 <g transform="rotate(-30 700 360)"><rect x="600" y="352" width="200" height="16" fill="#e2a33c"/><polygon points="800,352 824,360 800,368" fill="#f2d4a6"/></g>
 <rect width="800" height="400" fill="url(#licht)"/>
 <rect width="800" height="400" filter="url(#grain)" style="mix-blend-mode:overlay"/>
</svg>
</body></html>
