<!doctype html>
<!-- Der neue Backofen: das Angebot der Bank und Frau Sommers Budget-Zettel auf dem Tisch in der Backstube. Bildwelt Reportage / Abendlicht.
     Rendern: node scripts/bilder-rendern.cjs src/pages/finanzmathe/ratendarlehen_einstieg -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet"><style>body{margin:0}</style></head><body>
<svg id="bild" xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
 <defs>
  <linearGradient id="tisch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5a3a"/><stop offset="1" stop-color="#3e2618"/></linearGradient>
  <radialGradient id="licht" cx=".78" cy=".2" r=".8"><stop offset="0" stop-color="#ffd59a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd59a" stop-opacity="0"/></radialGradient>
  <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>
  <filter id="schatten"><feDropShadow dx="10" dy="14" stdDeviation="10" flood-opacity=".45"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .18 0"/></filter>
 </defs>
 <rect width="1200" height="600" fill="url(#tisch)"/>
 <g stroke="#2b1a10" stroke-opacity=".35" stroke-width="2" fill="none"><path d="M0 90 Q 600 70 1200 110"/><path d="M0 230 Q 600 210 1200 250"/><path d="M0 380 Q 600 360 1200 400"/><path d="M0 520 Q 600 500 1200 540"/></g>
 <!-- Mehlspuren -->
 <g fill="#f4ede2" opacity=".25"><ellipse cx="140" cy="520" rx="90" ry="30"/><ellipse cx="1080" cy="80" rx="70" ry="20"/></g>
 <!-- Angebot der Bank -->
 <g transform="rotate(-3 380 300)" filter="url(#schatten)">
  <rect x="90" y="60" width="580" height="480" fill="#fbf8f2"/>
  <rect x="90" y="60" width="580" height="70" fill="#9a4b2e"/>
  <text x="120" y="108" font-family="Helvetica, Arial" font-weight="700" font-size="32" fill="#fff">Angebot: Ratendarlehen</text>
  <g font-family="Helvetica, Arial" font-size="30" fill="#2b2422">
   <text x="120" y="200" fill="#6b5f58">Darlehen</text><text x="330" y="200" font-weight="700">60.000 €</text>
   <text x="120" y="270" fill="#6b5f58">Laufzeit</text><text x="330" y="270" font-weight="700">5 Jahre</text>
   <text x="120" y="340" fill="#6b5f58">Zinssatz</text><text x="330" y="340" font-weight="700">5 % p.a.</text>
   <text x="120" y="410" fill="#6b5f58">Tilgung</text><text x="330" y="410" font-weight="700">jedes Jahr</text><text x="330" y="448" font-weight="700">gleich hoch</text>
  </g>
  <line x1="120" y1="490" x2="400" y2="490" stroke="#b5aaa2" stroke-width="2"/>
  <text x="120" y="520" font-family="Helvetica, Arial" font-size="20" fill="#8a7f78">Volksbank am Markt</text>
 </g>
 <!-- Budget-Zettel -->
 <g transform="rotate(5 950 330)" filter="url(#schatten)">
  <rect x="770" y="170" width="360" height="300" fill="#fff3b8"/>
  <text x="800" y="240" font-family="Caveat, cursive" font-weight="700" font-size="50" fill="#2b2422">Mein Budget</text>
  <text x="800" y="300" font-family="Caveat, cursive" font-size="40" fill="#2b2422">höchstens</text>
  <text x="800" y="380" font-family="Caveat, cursive" font-weight="700" font-size="76" fill="#9a4b2e">14.500 €</text>
  <text x="800" y="436" font-family="Caveat, cursive" font-size="40" fill="#2b2422">pro Jahr!</text>
 </g>
 <!-- Bleistift -->
 <g transform="rotate(-24 900 540)"><rect x="760" y="530" width="260" height="20" fill="#e2a33c"/><polygon points="1020,530 1050,540 1020,550" fill="#f2d4a6"/><rect x="740" y="530" width="20" height="20" fill="#d07a8a"/></g>
 <rect width="1200" height="600" fill="url(#licht)"/>
 <rect width="1200" height="600" fill="url(#vig)"/>
 <rect width="1200" height="600" filter="url(#grain)" style="mix-blend-mode:overlay"/>
</svg>
</body></html>
