<!doctype html>
<!-- Bildwelt Reportage / Duoton (Schwarz + Kupfer), Aufmacher „Miras drei Fragen“: Sanduhr im Streiflicht, durch die Münzen rieseln,
     oben 5.000 €, unten Platz für mehr. Links oben bleibt Raum für Kicker und Schlagzeile. Tiefenunschärfe, Vignette, Filmkorn.
     Rendern: node scripts/bilder-rendern.cjs src/pages/finanzmathe/zinseszins_lernsituation/ls2 -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet"><style>body{margin:0}</style></head><body>
<svg id="bild" xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
 <defs>
  <radialGradient id="licht" cx=".72" cy=".42" r=".6"><stop offset="0" stop-color="#4a2a17"/><stop offset=".55" stop-color="#1d1714"/><stop offset="1" stop-color="#0d0d0d"/></radialGradient>
  <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".05"/><stop offset=".25" stop-color="#fff" stop-opacity=".28"/><stop offset=".55" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/></linearGradient>
  <linearGradient id="holz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3532"/><stop offset="1" stop-color="#151311"/></linearGradient>
  <linearGradient id="tisch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2420"/><stop offset="1" stop-color="#0c0b0a"/></linearGradient>
  <radialGradient id="muenze" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#f3b98e"/><stop offset=".5" stop-color="#c06a32"/><stop offset="1" stop-color="#6e3010"/></radialGradient>
  <radialGradient id="vig" cx=".55" cy=".5" r=".78"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
  <filter id="unscharf"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="weich"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="1.05" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .2 0"/></filter>
 </defs>
 <rect width="1200" height="600" fill="url(#licht)"/>
 <!-- unscharfer Hintergrund: Regal mit Ordnern -->
 <g filter="url(#unscharf)" opacity=".5">
  <rect x="40" y="250" width="1120" height="10" fill="#2b2522"/>
  <rect x="80" y="150" width="34" height="100" fill="#3b3330"/><rect x="120" y="140" width="30" height="110" fill="#5a3a26"/><rect x="156" y="160" width="36" height="90" fill="#2f2a27"/>
  <rect x="980" y="150" width="34" height="100" fill="#3b3330"/><rect x="1020" y="130" width="30" height="120" fill="#7a3d18"/><rect x="1056" y="160" width="36" height="90" fill="#2f2a27"/>
 </g>
 <!-- Tisch -->
 <rect x="0" y="470" width="1200" height="130" fill="url(#tisch)"/>
 <ellipse cx="840" cy="500" rx="260" ry="26" fill="#000" opacity=".6" filter="url(#weich)"/>
 <!-- Sanduhr -->
 <g transform="translate(840 0)">
  <rect x="-150" y="72" width="300" height="26" rx="6" fill="url(#holz)"/>
  <rect x="-150" y="452" width="300" height="26" rx="6" fill="url(#holz)"/>
  <rect x="-132" y="98" width="12" height="354" fill="#2b2522"/><rect x="120" y="98" width="12" height="354" fill="#2b2522"/>
  <path d="M-108 98 L108 98 Q108 210 14 275 Q108 340 108 452 L-108 452 Q-108 340 -14 275 Q-108 210 -108 98 Z" fill="#fff" fill-opacity=".04" stroke="#e9d6c8" stroke-opacity=".55" stroke-width="3"/>
  <!-- obere Münzen -->
  <path d="M-92 140 L92 140 Q86 200 12 258 L-12 258 Q-86 200 -92 140 Z" fill="#9a4515" opacity=".35"/>
  <g>
   <ellipse cx="-40" cy="200" rx="26" ry="9" fill="url(#muenze)"/><ellipse cx="10" cy="192" rx="26" ry="9" fill="url(#muenze)"/><ellipse cx="50" cy="176" rx="26" ry="9" fill="url(#muenze)"/>
   <ellipse cx="-30" cy="170" rx="26" ry="9" fill="url(#muenze)"/><ellipse cx="0" cy="226" rx="22" ry="8" fill="url(#muenze)"/>
  </g>
  <!-- fallende Münzen -->
  <ellipse cx="0" cy="300" rx="12" ry="5" fill="url(#muenze)"/><ellipse cx="2" cy="340" rx="12" ry="5" fill="url(#muenze)"/><ellipse cx="-2" cy="382" rx="12" ry="5" fill="url(#muenze)"/>
  <!-- untere Münzen: kleiner Stapel -->
  <ellipse cx="-30" cy="440" rx="30" ry="10" fill="url(#muenze)"/><ellipse cx="26" cy="442" rx="30" ry="10" fill="url(#muenze)"/><ellipse cx="0" cy="428" rx="30" ry="10" fill="url(#muenze)"/>
  <path d="M-108 98 L108 98 Q108 210 14 275 Q108 340 108 452 L-108 452 Q-108 340 -14 275 Q-108 210 -108 98 Z" fill="url(#glas)"/>
 </g>
 <!-- Notizzettel auf dem Tisch -->
 <g transform="translate(330 492) rotate(-6)">
  <rect x="0" y="0" width="300" height="74" rx="4" fill="#ece7e1"/>
  <text x="18" y="34" font-family="IBM Plex Sans" font-size="24" font-weight="600" fill="#161616">5.000 € · 3 %</text>
  <text x="18" y="62" font-family="IBM Plex Sans" font-size="20" font-weight="500" fill="#9a4515">verdoppelt nach ? Jahren</text>
 </g>
 <rect width="1200" height="600" fill="url(#vig)"/>
 <rect width="1200" height="600" filter="url(#grain)" opacity=".55"/>
</svg>
</body></html>
