<!doctype html>
<!-- Das Balkonkraftwerk, Handlungsprodukt (klein, 800 × 400). Bildwelt Diorama / Sommerwiese: großes Smartphone auf der Wiese mit angefangener Nachricht.
     Rendern: node scripts/bilder-rendern.cjs src/pages/trigonometrie/winkel_einstieg -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet"><style>body{margin:0}</style>
<script src="_iso.js"></script></head><body>
<div id="bild" style="width:800px;height:400px"></div>
<script>
const I = ISO(400, 120);
let g = I.hintergrund(800, 400);
g += '<ellipse cx="400" cy="370" rx="260" ry="20" fill="#5b6b7a" opacity=".22" filter="url(#sh)"/>';
g += I.insel(-30, -30, 300, 260);
g += I.baum(250, -10) + I.baum(-15, 210);
// Handy aufrecht vor der Wiese
g += `<g transform="rotate(-4 400 210)"><rect x="300" y="40" width="200" height="330" rx="26" fill="#22313d"/><rect x="312" y="62" width="176" height="286" rx="10" fill="#fff"/>
 <rect x="312" y="62" width="176" height="40" fill="#0e6670"/><text x="400" y="89" text-anchor="middle" font-family="Fredoka" font-size="20" font-weight="600" fill="#fff">Ayla und Familie</text>
 <rect x="324" y="116" width="152" height="150" rx="12" fill="#e2f1f2"/>
 <text x="334" y="142" font-family="Fredoka" font-size="16" font-weight="600" fill="#0e6670">Hallo Familie Yilmaz,</text>
 <polygon points="344,230 440,230 440,170" fill="none" stroke="#0e6670" stroke-width="3"/><path d="M428 230 v-12 h12" fill="none" stroke="#0e6670" stroke-width="2"/>
 ${[0,1,2].map(i => `<rect x="324" y="${280 + i * 18}" width="${150 - i * 30}" height="8" rx="4" fill="#c4ccd2"/>`).join('')}</g>`;
document.getElementById('bild').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">${g}</svg>`;
</script>
</body></html>
