<!doctype html>
<!-- Die Drehleiter, Handlungsprodukt (klein, 800 × 400). Bildwelt Comic / pop: Karteikarte „Fehlende Seite berechnen“ mit kleiner Skizze und drei leeren Schritten.
     Rendern: node scripts/bilder-rendern.cjs src/pages/trigonometrie/strecken_einstieg -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet"><style>body{margin:0}</style>
<script src="_comic.js"></script></head><body>
<div id="bild" style="width:800px;height:400px"></div>
<script>
const C = CO('#9a4515', '#fbece3');
const ink = '#141414', k = '#9a4515';
let s = '';
s += `<rect width="800" height="400" fill="url(#pT)"/>`;
s += `<g transform="rotate(-2 400 200)"><rect x="70" y="40" width="660" height="320" fill="#fff" stroke="${ink}" stroke-width="6"/><rect x="78" y="48" width="660" height="320" fill="none" stroke="${ink}" stroke-width="0"/>
  <rect x="70" y="40" width="660" height="64" fill="${k}" stroke="${ink}" stroke-width="6"/>
  <text x="400" y="86" text-anchor="middle" font-family="Bangers" font-size="40" fill="#fff" letter-spacing="2">FEHLENDE SEITE BERECHNEN</text>
  <polygon points="110,320 270,320 270,150" fill="#fbece3" stroke="${ink}" stroke-width="5" stroke-linejoin="round"/>
  <line x1="110" y1="320" x2="270" y2="150" stroke="${k}" stroke-width="8" stroke-linecap="round"/>
  <path d="M248 320 v-22 h22" fill="none" stroke="${ink}" stroke-width="3"/>
  ${[0, 1, 2].map(i => `<text x="320" y="${170 + i * 66}" font-family="Bangers" font-size="40" fill="${k}">${i + 1}.</text><line x1="360" y1="${172 + i * 66}" x2="690" y2="${172 + i * 66}" stroke="#9aa3ab" stroke-width="3" stroke-dasharray="6 8"/>`).join('')}
  </g>`;
s += `<g transform="rotate(25 690 40)"><rect x="660" y="10" width="26" height="80" rx="13" fill="none" stroke="#666" stroke-width="6"/></g>`;
document.getElementById('bild').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">${C.defs}${s}${C.korn(800, 400)}</svg>`;
</script>
</body></html>
