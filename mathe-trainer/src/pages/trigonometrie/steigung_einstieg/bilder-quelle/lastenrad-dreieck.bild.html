<!doctype html>
<!-- Das Lastenrad, Problem lösen. Bildwelt Siebdruck / zweifarbig: zwei Steigungsdreiecke (100 m waagrecht, 18 m bzw. 25 m hoch), Winkel gesucht.
     Rendern: node scripts/bilder-rendern.cjs src/pages/trigonometrie/steigung_einstieg -->
<html><head><meta charset="utf-8"><script src="_lastenrad.js"></script><script>document.write(LR.kopf)</script>
<style>body{margin:0} text{font-family:'Bricolage Grotesque';font-variation-settings:'wdth' 75,'opsz' 96}</style>
<script src="_siebdruck.js"></script></head><body><div id="bild"></div>
<script>
const L = 440;
const dreieck = (x0, h, name) => {
  const y0 = 450, hh = L * h / 100;
  return { pink: `<polygon points="${x0},${y0} ${x0 + L},${y0} ${x0 + L},${y0 - hh}" fill="RASTER" stroke="none"/>
      <path d="M${x0} ${y0} L${x0 + 90} ${y0} A90 90 0 0 0 ${x0 + 90 * Math.cos(Math.atan(h / 100))} ${y0 - 90 * Math.sin(Math.atan(h / 100))} Z" stroke="none"/>`,
    indigo: `<polygon points="${x0},${y0} ${x0 + L},${y0} ${x0 + L},${y0 - hh}" fill="none" stroke-width="8" stroke-linejoin="round"/>
      <path d="M${x0 + L - 30} ${y0} A30 30 0 0 1 ${x0 + L} ${y0 - 30}" fill="none" stroke-width="4"/><circle cx="${x0 + L - 11}" cy="${y0 - 11}" r="4.5" stroke="none"/>
      <text x="${x0 + L / 2}" y="${y0 + 52}" text-anchor="middle" font-size="38" font-weight="700" stroke="none">100 m waagrecht</text>
      <text x="${x0 + L + 16}" y="${y0 - hh / 2 + 14}" font-size="40" font-weight="800" stroke="none">${h} m</text>
      <text x="${x0 + 10}" y="${y0 - 70}" font-size="40" font-weight="800" stroke="none">α = ?</text><path d="M${x0 + 40} ${y0 - 60} Q${x0 + 60} ${y0 - 30} ${x0 + 70} ${y0 - 8}" fill="none" stroke-width="4"/>
      <text x="${x0}" y="150" font-size="52" font-weight="800" stroke="none">${name}</text>
      <text x="${x0}" y="205" font-size="40" font-weight="700" stroke="none">Schild: ${h} %</text>` };
};
const a = dreieck(50, 18, 'Kirchbergstraße'), b = dreieck(640, 25, 'Bahnhofsrampe');
SD.bild(1200, 600, [
  { farbe: LR.PINK, svg: a.pink + b.pink },
  { farbe: LR.INDIGO, versatz: [4, -3], svg: a.indigo + b.indigo + '<text x="50" y="80" font-size="34" font-weight="600" stroke="none">Steigungsdreiecke, maßstäblich gezeichnet</text>' },
]);
</script>
</body></html>
