<!doctype html>
<!-- Der Handyständer, Titelbild. Bildwelt Bauplan / Lasercut: Sperrholzplatte, links der fertige Handyständer (Seitenteil 8 cm, 15 cm, 17 cm)
     mit Handy, rechts die ausgeschnittenen Bauteile und das Schriftfeld mit Jules Wunsch (Tablet, 70°).
     Rendern: node scripts/bilder-rendern.cjs src/pages/trigonometrie/sinus_kosinus_tangens_einstieg -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet"><style>body{margin:0}</style>
<script src="_lasercut.js"></script></head><body>
<div id="bild" style="width:1200px;height:600px"></div>
<script>
const W = 1200, H = 600;
let g = LC.defs + LC.grund(W, H);
// Fertiger Ständer, Seitenansicht: 1 cm = 22 px
const s = 22, A = [150, 500], B = [150 + 8 * s, 500], C = [150 + 8 * s, 500 - 15 * s];
// Bodenplatte unter dem Ständer
g += LC.teil(`M${A[0] - 40} ${A[1]} H${B[0] + 30} V${A[1] + 22} H${A[0] - 40} Z`, '#e6c995');
g += LC.teil(`M${A[0]} ${A[1]} L${B[0]} ${B[1]} L${C[0]} ${C[1]} Z`);
// Handy an der schrägen Kante (Auflage), mit Abstand nach außen
const ux = (C[0] - A[0]) / (17 * s), uy = (C[1] - A[1]) / (17 * s), nx = uy, ny = -ux;
const p = (t, d) => [A[0] + ux * t + nx * d, A[1] + uy * t + ny * d];
const h1 = p(18, 6), h2 = p(318, 6), h3 = p(318, 30), h4 = p(18, 30);
g += `<path d="M${h1} L${h2} L${h3} L${h4} Z" fill="#2f3438" stroke="#15181b" stroke-width="3" stroke-linejoin="round" filter="url(#lc-schatten)"/>`;
const q1 = p(34, 9), q2 = p(302, 9), q3 = p(302, 14), q4 = p(34, 14);
g += `<path d="M${q1} L${q2} L${q3} L${q4} Z" fill="#7d93a3"/>`;
// Anschlag vorne, damit das Handy nicht rutscht
g += LC.teil(`M${A[0] - 30} ${A[1]} L${A[0] - 30} ${A[1] - 26} L${A[0] - 14} ${A[1] - 26} L${A[0] - 4} ${A[1]} Z`, '#e6c995');
g += LC.rechter(B[0], B[1], -1, -1);
g += LC.winkel(A[0], A[1], 58, 0, 61.93, 'α');
g += LC.mass(A[0], A[1], B[0], B[1], '8 cm', 52);
g += LC.mass(B[0], B[1], C[0], C[1], '15 cm', 42);
g += LC.gravur(C[0] + 80, C[1] + 60, 'Mein Handyständer', 32, 'start', '#3b230e', 700);
g += LC.gravur(C[0] + 80, C[1] + 94, "Seitenteil: Boden 8 cm, Rücken 15 cm,", 24, 'start', '#4a2b10', 500);
g += LC.gravur(C[0] + 80, C[1] + 124, 'Auflage 17 cm', 24, 'start', '#4a2b10', 500);

// Ausgeschnittene Bauteile rechts: zwei Seitenteile und ein Steg, Platte mit Restloch
const t = 11, X0 = 560, Y0 = 520;
[[X0, Y0], [X0 + 120, Y0]].forEach(([x, y]) => {
  g += LC.teil(`M${x} ${y} L${x + 8 * t} ${y} L${x + 8 * t} ${y - 15 * t} Z`);
});
g += LC.teil(`M${X0 + 240} ${Y0} h210 v-36 h-210 Z`);
g += `<circle cx="${X0 + 270}" cy="${Y0 - 18}" r="7" fill="#3b230e" fill-opacity=".55"/><circle cx="${X0 + 420}" cy="${Y0 - 18}" r="7" fill="#3b230e" fill-opacity=".55"/>`;
g += LC.gravur(X0 + 345, Y0 - 11, 'Steg', 22, 'middle');
g += LC.gravur(X0, Y0 + 44, 'Zuschnitt aus 4 mm Pappelsperrholz', 22, 'start', '#4a2b10', 500);

// Schriftfeld: Jules Wunsch
g += LC.feld(780, 60, 360, 'Neuer Auftrag', [['Kundin', 'Jule'], ['Gerät', 'Tablet'], ['Neigung α', '70°'], ['Maße', '?']]);
document.getElementById('bild').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
</script></body></html>
