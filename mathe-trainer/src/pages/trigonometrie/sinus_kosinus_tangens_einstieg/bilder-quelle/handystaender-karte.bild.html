<!doctype html>
<!-- Der Handyständer, Handlungsprodukt: eine Werkstatt-Karte im Heft mit Skizze des Seitenteils (Seiten farbig, Winkel α markiert)
     und angefangenen Zeilen für Sinus, Kosinus, Tangens und die Antwort an Jule. Bildwelt Bauplan / Lasercut.
     Rendern: node scripts/bilder-rendern.cjs src/pages/trigonometrie/sinus_kosinus_tangens_einstieg -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet"><style>body{margin:0}</style>
<script src="_lasercut.js"></script></head><body>
<div id="bild" style="width:800px;height:400px"></div>
<script>
const W = 800, H = 400;
let g = LC.defs + LC.grund(W, H, '#e2c58f');
// Karte als ausgeschnittenes Holzschild mit Loch
g += LC.teil('M60 40 H740 V360 H60 Z', '#f6e7c8');
g += `<circle cx="96" cy="76" r="11" fill="#7a5328" stroke="#3b230e" stroke-width="2.5"/>`;
g += LC.gravur(130, 88, 'Werkstatt-Karte: Seitenteil prüfen', 34, 'start', '#3b230e', 700);
// Skizze: Hypotenuse, Gegenkathete und Ankathete farbig
const A = [120, 320], B = [250, 320], C = [250, 140];
g += `<path d="M${A} L${B}" stroke="#2c6b74" stroke-width="7" stroke-linecap="round"/><path d="M${B} L${C}" stroke="#8a5800" stroke-width="7" stroke-linecap="round"/><path d="M${C} L${A}" stroke="#3b230e" stroke-width="7" stroke-linecap="round"/>`;
g += LC.winkel(A[0], A[1], 36, 0, 54, 'α', LC.A, 56);
g += LC.rechter(B[0], B[1], -1, -1, 20);
g += LC.gravur(185, 352, 'AK', 24, 'middle', '#2c6b74', 700) + LC.gravur(274, 238, 'GK', 24, 'start', '#8a5800', 700) + LC.gravur(160, 210, 'H', 26, 'end', '#3b230e', 700);
// Zeilen
const z = [['sin α =', '— : —'], ['cos α =', '— : —'], ['tan α =', '— : —'], ['Antwort an Jule:', '']];
z.forEach(([k, v], i) => {
  const y = 160 + i * 50;
  g += LC.gravur(340, y, k, 28, 'start', '#3b230e', 700) + LC.gravur(470, y, v, 26, 'start', '#8a5800', 600);
  g += `<line x1="${i === 3 ? 530 : 470}" x2="700" y1="${y + 8}" y2="${y + 8}" stroke="#3b230e" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="4 5"/>`;
});
document.getElementById('bild').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
</script></body></html>
