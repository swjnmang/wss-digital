<!doctype html>
<!-- Das Lichtwerk, Handlungsprodukt Merkkarte „Scheitelpunkt berechnen“. Bildwelt Comic / manga.
     Rendern: node scripts/bilder-rendern.cjs src/pages/quadratische_funktionen/scheitelpunkt_einstieg -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet"><style>body{margin:0}</style>
<script src="_comic.js"></script></head><body>
<div id="bild" style="width:800px;height:400px"></div>
<script>
const C = CO('#141414', '#ffffff');
const ink = '#141414';
let inhalt = `<g transform="rotate(-2 400 210)"><rect x="100" y="66" width="600" height="290" fill="#fff" stroke="${ink}" stroke-width="6"/>
<rect x="100" y="66" width="600" height="64" fill="${ink}"/>
<text x="130" y="112" font-family="Bangers" font-size="40" fill="#fff" letter-spacing="2">SCHEITELPUNKT BERECHNEN</text>`;
['a, b, c ablesen', 'x<tspan baseline-shift="sub" font-size="19">S</tspan> = −b : (2a)', 'x<tspan baseline-shift="sub" font-size="19">S</tspan> einsetzen → y<tspan baseline-shift="sub" font-size="19">S</tspan>', 'S( x<tspan baseline-shift="sub" font-size="19">S</tspan> | y<tspan baseline-shift="sub" font-size="19">S</tspan> ) angeben'].forEach((t, i) => {
  const y = 172 + i * 46;
  inhalt += `<circle cx="146" cy="${y - 10}" r="18" fill="#fff" stroke="${ink}" stroke-width="4"/><text x="146" y="${y}" font-family="Bangers" font-size="26" text-anchor="middle" fill="${ink}">${i + 1}</text><text x="180" y="${y}" font-family="Comic Neue" font-weight="700" font-size="27" fill="${ink}">${t}</text>`;
});
const P = (x) => `${560 + x * 26},${330 - (6 - (x - 2.5) ** 2) * 26}`;
inhalt += `<polyline points="${Array.from({ length: 51 }, (_, i) => P(i / 10)).join(' ')}" fill="none" stroke="${ink}" stroke-width="5"/><line x1="${560 + 2.5 * 26}" y1="160" x2="${560 + 2.5 * 26}" y2="340" stroke="${ink}" stroke-width="3" stroke-dasharray="8 6"/><circle cx="${560 + 2.5 * 26}" cy="${330 - 6 * 26}" r="10" fill="#fff" stroke="${ink}" stroke-width="4"/></g>`;
const s = C.panel('p', '18,18 782,18 782,382 18,382', 'url(#pF)', inhalt);
document.getElementById('bild').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">${C.defs}${C.papier(800, 400)}${s}${C.korn(800, 400)}</svg>`;
</script>
</body></html>
