<!doctype html>
<!-- Das Gleichungs-Labor, Handlungsprodukt Flussdiagramm „Welcher Weg?“. Bildwelt Skizzenbuch / Tafel.
     Rendern: node scripts/bilder-rendern.cjs src/pages/quadratische_funktionen/funktionsgleichung_einstieg -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet"><style>body{margin:0}</style>
<script src="_tafel.js"></script></head><body>
<div id="bild" style="width:800px;height:400px"></div>
<script>
const K = TAFEL.K, V = '#c9b6ff', G = '#ffe08a';
let g = `<g filter="url(#kreide)" font-family="Caveat" font-weight="700" fill="${K}" stroke-linecap="round">`;
g += `<polygon points="400,40 560,88 400,136 240,88" fill="none" stroke="${G}" stroke-width="4"/><text x="400" y="98" font-size="30" text-anchor="middle">Zahl vor x oder y?</text>`;
[[150, 'gleich: I − II'], [400, 'Gegenzahl: I + II'], [650, 'sonst: erst mal k']].forEach(([x, t]) => {
  g += `<line x1="400" y1="136" x2="${x}" y2="186" stroke="${K}" stroke-width="3.5"/><rect x="${x - 110}" y="190" width="220" height="56" rx="8" fill="none" stroke="${V}" stroke-width="4"/><text x="${x}" y="228" font-size="30" text-anchor="middle">${t}</text><line x1="${x}" y1="246" x2="400" y2="296" stroke="${K}" stroke-width="3.5"/>`;
});
g += `<rect x="270" y="298" width="260" height="56" rx="8" fill="none" stroke="${G}" stroke-width="4"/><text x="400" y="336" font-size="32" text-anchor="middle">einsetzen, Probe</text></g>`;
document.getElementById('bild').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">${TAFEL.defs}${TAFEL.grund(800, 400)}${g}</svg>`;
</script>
</body></html>
