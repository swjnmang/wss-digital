<!doctype html>
<!-- Der Korbwurf, Titelbild (Aufmacher). Bildwelt Reportage / Hochglanz: helle Sporthalle, Korb mit Tiefenunschärfe, gefilmte Wurfbahn mit P und Q,
     Bereich „nicht gefilmt“, Handy auf dem Stativ. Rendern: node scripts/bilder-rendern.cjs src/pages/quadratische_funktionen/funktionsgleichung_einstieg -->
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet"><style>body{margin:0}</style></head><body>
<svg id="bild" xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
 <defs>
  <linearGradient id="wand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9eef3"/><stop offset=".7" stop-color="#d7dee6"/><stop offset="1" stop-color="#c4ccd6"/></linearGradient>
  <linearGradient id="boden" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a066"/><stop offset="1" stop-color="#b47a43"/></linearGradient>
  <radialGradient id="licht" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="ball" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffb366"/><stop offset=".6" stop-color="#e2711d"/><stop offset="1" stop-color="#a0460c"/></radialGradient>
  <linearGradient id="kopf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16202b" stop-opacity=".72"/><stop offset=".55" stop-color="#16202b" stop-opacity=".25"/><stop offset="1" stop-color="#16202b" stop-opacity="0"/></linearGradient>
  <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
  <filter id="unscharf"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="leicht"><feGaussianBlur stdDeviation="1.4"/></filter>
  <filter id="korn" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="5"/><feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .07 0"/></filter>
  <filter id="schatten" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1a2230" flood-opacity=".35"/></filter>
 </defs>
 <rect width="1200" height="600" fill="url(#wand)"/>
 <!-- Hallenfenster oben, unscharf -->
 <g filter="url(#unscharf)" opacity=".8">
  <rect x="60" y="40" width="1080" height="110" fill="#f7fbff"/>
  <g fill="#b9c6d3">${''}</g>
  <rect x="60" y="40" width="1080" height="110" fill="none" stroke="#a9b6c4" stroke-width="10"/>
  <line x1="330" x2="330" y1="40" y2="150" stroke="#a9b6c4" stroke-width="10"/><line x1="600" x2="600" y1="40" y2="150" stroke="#a9b6c4" stroke-width="10"/><line x1="870" x2="870" y1="40" y2="150" stroke="#a9b6c4" stroke-width="10"/>
 </g>
 <rect width="1200" height="380" fill="url(#licht)"/>
 <!-- Boden mit Linien -->
 <polygon points="0,440 1200,440 1200,600 0,600" fill="url(#boden)"/>
 <g stroke="#f7f1e6" stroke-width="5" opacity=".8" filter="url(#leicht)"><line x1="0" y1="520" x2="1200" y2="500"/><path d="M820 440 Q 760 520 900 600" fill="none"/></g>
 <!-- Korbanlage rechts, leicht unscharf -->
 <g filter="url(#leicht)">
  <rect x="1088" y="150" width="20" height="290" fill="#3d4652"/>
  <rect x="1010" y="130" width="120" height="96" rx="4" fill="#fbfdff" stroke="#3d4652" stroke-width="6"/>
  <rect x="1040" y="168" width="54" height="40" fill="none" stroke="#e2711d" stroke-width="5"/>
  <ellipse cx="1000" cy="214" rx="50" ry="10" fill="none" stroke="#e2611a" stroke-width="7"/>
  <path d="M955 216 L970 270 L1000 278 L1030 270 L1045 216" fill="none" stroke="#f3f3f3" stroke-width="3" opacity=".9"/>
 </g>
 <!-- nicht gefilmter Bereich -->
 <rect x="520" y="70" width="260" height="370" fill="#28323d" opacity=".55"/>
 <text x="650" y="270" text-anchor="middle" font-family="IBM Plex Sans" font-weight="600" font-size="30" fill="#fff">nicht gefilmt</text>
 <text x="650" y="320" text-anchor="middle" font-family="IBM Plex Sans" font-weight="600" font-size="48" fill="#fff">?</text>
 <!-- gefilmte Bahn bis zum Rand des Bereichs -->
 <path d="M150 440 Q 330 230 520 260" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="10 9"/>
 <g font-family="IBM Plex Sans" font-weight="600" font-size="24" fill="#1e2a36">
  <circle cx="263" cy="320" r="9" fill="#fff" stroke="#1e2a36" stroke-width="3"/><text x="250" y="300" text-anchor="end">P</text>
  <circle cx="380" cy="270" r="9" fill="#fff" stroke="#1e2a36" stroke-width="3"/><text x="380" y="248" text-anchor="middle">Q</text>
 </g>
 <!-- Ball am Ende der gefilmten Strecke mit Bewegungsunschärfe -->
 <g filter="url(#schatten)" transform="translate(0 110)"><circle cx="505" cy="150" r="26" fill="url(#ball)"/><path d="M481 150 h48 M505 126 q-12 24 0 48 M505 126 q12 24 0 48" stroke="#5a2a08" stroke-width="2" fill="none" opacity=".7"/></g>
 <!-- Handy auf Stativ, vorne links, unscharf -->
 <g filter="url(#unscharf)">
  <line x1="120" y1="600" x2="150" y2="470" stroke="#2a2f36" stroke-width="10"/><line x1="200" y1="600" x2="160" y2="470" stroke="#2a2f36" stroke-width="10"/>
  <rect x="105" y="390" width="110" height="78" rx="12" fill="#1a1d22"/><rect x="113" y="398" width="94" height="62" rx="6" fill="#4a7fb0"/>
 </g>
 <rect width="1200" height="300" fill="url(#kopf)"/>
 <rect width="1200" height="600" fill="url(#vig)"/>
 <rect width="1200" height="600" filter="url(#korn)"/>
</svg>
</body></html>
